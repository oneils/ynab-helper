{{define "sort-toggle"}}
<button
    type="button"
    id="sort-toggle-btn"
    class="sort-toggle"
    hx-get="/bank-txns?budget={{.Budget}}&account={{.Account}}&status={{.ActiveStatus}}&sort={{if eq .Sort "desc"}}asc{{else}}desc{{end}}"
    hx-target="#txn-list-panel"
    hx-swap="innerHTML"
    hx-disabled-elt="this"
    onclick="localStorage.setItem('ynab_txn_sort', '{{if eq .Sort "desc"}}asc{{else}}desc{{end}}')"
>
    {{if eq .Sort "desc"}}
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
    <span>Oldest first</span>
    {{else}}
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <polyline points="19 12 12 19 5 12"></polyline>
    </svg>
    <span>Newest first</span>
    {{end}}
</button>
<input type="hidden" id="sort-state" name="sort" value="{{.Sort}}">
{{end}}

{{define "bank-transactions"}}

{{template "sort-toggle" .}}

{{if .Txns}}
<figure class="txn-table-scroll">
    <table role="grid" class="transactions-table">
        <thead>
            <tr>
                <th scope="col">Date</th>
                <th scope="col">Description</th>
                <th scope="col">Amount</th>
                <th scope="col">Payee</th>
                <th scope="col">Category</th>
                <th scope="col">Status</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            {{template "txn-rows" .}}
        </tbody>
    </table>
</figure>
{{else}}
<div class="empty-state">
    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="64"
        height="64"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
    </svg>
    <h3>No Transactions found</h3>
    <p>Select a Budget and Account to view transactions</p>
</div>
{{end}}

{{end}}
